<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="질문 4개에 답하면 AI 없이도 나에게 맞는 직무 TOP5와 자동 직무분석 리포트가 만들어지는 진단형 도구 — 진로설계 집중프로그램">
<title>나의 직무분석설계도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ink:#1F2A4D;
    --ink-soft:#4A5578;
    --accent:#4456B8;
    --accent-2:#5B6FD6;
    --accent-soft:#EEF0FB;
    --gold:#B8860A;
    --gold-soft:#FBF1D6;
    --rose:#B5473F;
    --rose-soft:#FBEEEC;
    --green:#2F7A52;
    --green-soft:#E8F3EC;
    --paper:#F7F7FB;
    --surface:#FFFFFF;
    --line:#DFE2ED;
    --line-soft:#EBEDF5;
    --shadow: 0 1px 2px rgba(31,42,77,0.04), 0 8px 24px -12px rgba(31,42,77,0.18);
    --radius: 16px;
    --font-display:'Gowun Batang', 'Nanum Myeongjo', serif;
    --font-body:'IBM Plex Sans KR', 'Noto Sans KR', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'IBM Plex Sans KR', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E9EBF6; --ink-soft:#B7BEDA; --accent:#8393EE; --accent-2:#6E80E0;
      --accent-soft:#232A52; --gold:#E8C158; --gold-soft:#3A331B;
      --rose:#E68A83; --rose-soft:#3A2422; --green:#7CC79E; --green-soft:#1E3A2C;
      --paper:#12152A; --surface:#1A1E3A; --line:#323A63; --line-soft:#262C4E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E9EBF6; --ink-soft:#B7BEDA; --accent:#8393EE; --accent-2:#6E80E0;
    --accent-soft:#232A52; --gold:#E8C158; --gold-soft:#3A331B;
    --rose:#E68A83; --rose-soft:#3A2422; --green:#7CC79E; --green-soft:#1E3A2C;
    --paper:#12152A; --surface:#1A1E3A; --line:#323A63; --line-soft:#262C4E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-body);
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent); }
  button{ font-family:var(--font-body); }

  .app{ max-width:1180px; margin:0 auto; padding:32px 20px 90px; }

  .app-header{ text-align:center; margin-bottom:30px; }
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent); margin:0 0 10px;
  }
  .app-title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(26px,4vw,36px);
    margin:0; text-wrap:balance;
  }
  .app-sub{ margin:10px auto 0; color:var(--ink-soft); font-size:14.5px; max-width:46ch; }

  /* ================= QUIZ ================= */
  .quiz-wrap{ display:flex; justify-content:center; }
  .quiz-card{
    width:100%; max-width:660px; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; box-shadow:var(--shadow); padding:32px 30px 28px;
  }
  .dots{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
  .dot{ width:8px; height:8px; border-radius:999px; background:var(--line); transition:background .2s, width .2s; }
  .dot.active{ background:var(--accent); width:22px; }
  .dot.done{ background:var(--accent-2); }

  .q-step-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--accent); text-align:center; margin:0 0 6px; letter-spacing:.05em; }
  .q-title{ font-family:var(--font-display); font-size:22px; font-weight:700; text-align:center; margin:0 0 6px; text-wrap:balance; }
  .q-hint{ text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 24px; }

  .opt-grid{ display:grid; gap:10px; }
  .opt-grid.cols-2{ grid-template-columns:1fr 1fr; }
  .opt-grid.cols-1{ grid-template-columns:1fr; }
  @media (max-width:480px){ .opt-grid.cols-2{ grid-template-columns:1fr; } }

  .opt-card{
    text-align:left; border:1.5px solid var(--line); background:var(--paper); border-radius:12px;
    padding:14px 16px; cursor:pointer; transition:border-color .12s, transform .12s, background .12s;
    font-family:var(--font-body); color:var(--ink);
  }
  .opt-card:hover{ border-color:var(--accent-2); transform:translateY(-1px); }
  .opt-card .opt-title{ font-weight:700; font-size:14.5px; margin:0 0 3px; display:flex; align-items:center; gap:8px; }
  .opt-card .opt-desc{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .opt-card[data-selected="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .opt-card[data-selected="true"] .opt-title{ color:var(--accent); }
  .opt-badge{
    width:24px; height:24px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:700; color:#fff; flex:none;
  }
  .badge-D{ background:#B5473F; } .badge-I{ background:#D9A818; color:#3a2a00; }
  .badge-S{ background:#3E8A63; } .badge-C{ background:#4456B8; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .chip-opt{
    border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft);
    font-size:13px; font-weight:600; padding:9px 15px; border-radius:999px; cursor:pointer;
  }
  .chip-opt[data-selected="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .chip-opt:disabled{ opacity:.4; cursor:not-allowed; }

  .step-note{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:14px; }
  .sub-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:18px 0 10px; text-align:center; }
  .field-label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:20px 0 8px; }
  .text-input{
    width:100%; font-family:var(--font-body); font-size:14px; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); border-radius:10px; padding:11px 14px;
  }
  .text-input:focus{ outline:2px solid var(--accent-2); outline-offset:0; border-color:transparent; }

  .quiz-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:10px; }
  .btn{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font-size:13.5px; font-weight:600; padding:11px 20px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:hover{ border-color:var(--accent-2); transform:translateY(-1px); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-2); border-color:var(--accent-2); }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:8px 14px; font-size:12.5px; }

  /* ================= RESULTS ================= */
  .results{ display:none; }
  .results.active{ display:block; }
  .quiz-wrap.hidden{ display:none; }

  .summary-bar{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    margin-bottom:26px; padding:14px 18px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px;
  }
  .summary-tag{ font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .summary-bar .btn{ margin-left:auto; }

  .results-grid{ display:grid; grid-template-columns:340px minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:860px){ .results-grid{ grid-template-columns:1fr; } }

  .rank-list{ display:flex; flex-direction:column; gap:10px; }
  .rank-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;
    cursor:pointer; transition:border-color .12s;
  }
  .rank-card[data-active="true"]{ border-color:var(--accent); box-shadow:var(--shadow); }
  .rank-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .rank-name{ font-weight:700; font-size:15px; }
  .rank-pct{ font-family:var(--font-mono); font-size:13px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .rank-fam{ font-size:11.5px; color:var(--ink-soft); margin:2px 0 8px; }
  .rank-bar-track{ height:6px; border-radius:999px; background:var(--line-soft); overflow:hidden; margin-bottom:8px; }
  .rank-bar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .rank-reason{ font-size:12px; color:var(--ink-soft); line-height:1.55; }

  .blueprint{ background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; position:sticky; top:20px; }
  .bp-head{ background:radial-gradient(140% 160% at 100% 0%, var(--accent-soft), transparent 55%), var(--surface); padding:26px 26px 20px; border-bottom:1px solid var(--line); }
  .bp-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
  .bp-jobname{ font-family:var(--font-display); font-size:clamp(22px,3vw,28px); font-weight:700; margin:0; text-wrap:balance; }
  .bp-tags{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .tag{ font-size:12px; font-weight:600; padding:5px 11px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .tag.pct{ background:var(--green-soft); color:var(--green); }

  .bp-body{ padding:22px 26px 28px; display:flex; flex-direction:column; gap:20px; }
  .bp-section-title{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .bp-section-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }

  .bp-reason{
    font-family:var(--font-display); font-size:15px; line-height:1.75;
    padding:14px 16px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 10px 10px 0;
  }
  .bp-definition{ font-size:13.5px; line-height:1.7; }

  .bp-tasks{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .bp-tasks li{ display:flex; gap:10px; font-size:13.5px; align-items:flex-start; }
  .bp-tasks .n{ font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-soft); width:20px; height:20px; border-radius:6px; flex:none; display:inline-flex; align-items:center; justify-content:center; margin-top:1px; }

  .bp-split{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .bp-split{ grid-template-columns:1fr; } }
  .bp-box{ border-radius:10px; padding:12px 14px; font-size:13px; }
  .bp-box.good{ background:var(--accent-soft); } .bp-box.tough{ background:var(--rose-soft); }
  .bp-box-title{ font-weight:700; font-size:12.5px; margin-bottom:4px; }
  .bp-box.good .bp-box-title{ color:var(--accent); } .bp-box.tough .bp-box-title{ color:var(--rose); }

  .bp-line{ font-size:13.5px; }
  .bp-line b{ font-size:12px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:3px; }

  .bp-actions{ display:flex; flex-direction:column; gap:6px; }
  .bp-actions label{ display:flex; gap:8px; align-items:flex-start; font-size:13px; }
  .bp-actions input{ margin-top:3px; }

  .bp-footer{ padding:14px 26px; background:var(--paper); display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); border-top:1px solid var(--line); }

  @media print{
    .quiz-wrap, .summary-bar .btn, .rank-list{ display:none !important; }
    .results-grid{ grid-template-columns:1fr; }
    .blueprint{ box-shadow:none; border:none; position:static; }
    body{ background:#fff; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <p class="eyebrow">2026 진로설계 집중프로그램 · 진단형</p>
    <h1 class="app-title">나의 직무분석설계도</h1>
    <p class="app-sub">질문 4개에 답하면, AI 없이도 나에게 맞는 직무 TOP3와 직무분석 리포트가 자동으로 만들어집니다.</p>
  </header>

  <!-- ============ QUIZ ============ -->
  <div class="quiz-wrap" id="quizWrap">
    <div class="quiz-card">
      <div class="dots" id="dots"></div>
      <div id="stepContent"></div>
      <div class="quiz-nav">
        <button class="btn ghost" id="prevBtn" type="button">이전</button>
        <button class="btn primary" id="nextBtn" type="button" disabled>다음</button>
      </div>
    </div>
  </div>

  <!-- ============ RESULTS ============ -->
  <div class="results" id="results">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="results-grid">
      <div class="rank-list" id="rankList"></div>
      <div class="blueprint" id="blueprint"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- 22 직무 데이터베이스 ----------------
  var JOBS = [

      def:"기업의 중장기 비전과 성장전략을 수립하고, 시장·경쟁 분석을 통해 경영진의 의사결정을 지원하는 업무",
      tasks:["중장기 사업전략 수립","시장·경쟁사 분석","신사업 타당성 검토","경영진 보고자료 작성"],

      req:"논리적 사고력, 데이터 분석력, 비즈니스 전반에 대한 이해", trend:"데이터 기반 시나리오 플래닝과 생성형 AI를 활용한 시장분석 역량이 중요해지는 추세"},
    {family:"경영지원", name:"인사 HRM", discPrimary:"I", discSecondary:"S", workstyle:["사람소통","문제해결"], keywords:["사람 만나기","조율·협업","협상"],
      def:"채용·평가·보상·조직문화 등 회사의 인재관리 전반을 기획하고 운영하는 업무",
      tasks:["채용 전형 기획·운영","평가·보상 제도 운영","조직문화·복지 기획","노무·인사제도 관리"],

    {family:"경영지원", name:"인사 HRD", discPrimary:"I", discSecondary:"S", workstyle:["사람소통","창의제작"], keywords:["사람 만나기","글쓰기·콘텐츠","조율·협업"],
      def:"임직원의 역량 향상과 경력개발을 위한 교육체계를 수립·운영하는 업무",
      tasks:["연간 교육계획 수립","교육과정 개발·운영","교육효과 측정","리더십·직무교육 기획"],

    {family:"경영지원", name:"총무", discPrimary:"S", discSecondary:"C", workstyle:["현장실행","문제해결"], keywords:["현장관리","조율·협업","고객응대"],
      def:"자산·시설관리, 사내 복지, 업무지원 등 조직이 원활히 운영되도록 지원하는 업무",

    {family:"경영지원", name:"재무회계", discPrimary:"C", discSecondary:"S", workstyle:["데이터분석","전문성숙련"], keywords:["숫자·데이터","꼼꼼함"],
      def:"자금 조달·운용과 회계장부 관리를 통해 회사의 재무 건전성을 지키는 업무",
      tasks:["자금 조달·운용 계획","결산·재무제표 작성","예산·비용 관리","세무 신고 지원"],
      good:"숫자로 회사의 건강 상태를 명확히 파악할 수 있음", tough:"결산·마감 시기 업무 강도가 매우 높음",
      req:"숫자에 대한 정확성, 회계 기초지식, 꼼꼼함", trend:"회계 자동화 도구 확산으로 데이터 해석·재무전략 조언 역량이 중요해지는 추세"},

    "창의제작":"창의적으로 콘텐츠·결과물을 만드는 일", "협상거래":"협상하고 거래를 성사시키는 일",
    "문제해결":"돌발 문제를 진단하고 해결하는 일"
  };
  var FAMILIES = ["경영지원","영업/마케팅","생산제조","연구개발","IT","물류"];
  var KEYWORDS = ["사람 만나기","숫자·데이터","전략 수립","글쓰기·콘텐츠","협상","꼼꼼함","트렌드","현장관리","기술·개발","리서치","해외·외국어","안전·품질","고객응대","조율·협업"];

  var ACTIONS = ["관련 자격증·교육과정 찾아보기","현직자 인터뷰 / OB·OG 컨택","채용공고 자격요건 분석해보기","관련 동아리·대외활동 찾아보기"];

  // ---------------- 상태 ----------------
  var answers = { discPrimary:null, discSecondary:null, major:"", families:[], workstyle:null, keywords:[] };
  var step = 1;
  var TOTAL_STEPS = 4;
  var selectedJobIndex = 0;
  var rankedJobs = [];

  var $ = function(id){ return document.getElementById(id); };

  function renderDots(){
    var html = "";
    for (var i=1;i<=TOTAL_STEPS;i++){
      var cls = "dot" + (i===step ? " active" : (i<step ? " done" : ""));
      html += '<span class="'+cls+'"></span>';
    }
    $("dots").innerHTML = html;
  }

  function renderStep(){
    renderDots();
    var html = "";
    if (step === 1){
      html += '<p class="q-step-label">STEP 1 / 4</p>';
      html += '<p class="q-title">나의 eDISC 유형은?</p>';
      html += '<p class="q-hint">주 유형을 선택하세요 (필요하면 보조 유형까지 최대 2코드)</p>';
      html += '<div class="opt-grid cols-2">';
      ["D","I","S","C"].forEach(function(k){
        var d = DISC[k];
        var sel = answers.discPrimary === k;
        html += '<button type="button" class="opt-card" data-selected="'+sel+'" data-disc-primary="'+k+'">'+
          '<p class="opt-title"><span class="opt-badge badge-'+k+'">'+k+'</span>'+d.label+'</p>'+
          '<p class="opt-desc">'+d.desc+'</p></button>';
      });
      html += '</div>';
      if (answers.discPrimary){
        html += '<p class="sub-label">+ 보조 유형 (선택, 최대 1개 — 나와 다음으로 가까운 유형)</p>';
        html += '<div class="chip-grid">';
        ["D","I","S","C"].filter(function(k){ return k !== answers.discPrimary; }).forEach(function(k){
          var sel2 = answers.discSecondary === k;
          html += '<button type="button" class="chip-opt" data-selected="'+sel2+'" data-disc-secondary="'+k+'">'+DISC[k].label+'</button>';
        });
        html += '</div>';
      }
      html += '<label class="field-label" for="majorInput">전공 (선택, 결과 리포트에 표시돼요)</label>';
      html += '<input type="text" class="text-input" id="majorInput" placeholder="예: 경영학과" value="'+escapeHtml(answers.major || "")+'">';
    } else if (step === 2){
      html += '<p class="q-step-label">STEP 2 / 4</p>';
      html += '<p class="q-title">관심 있는 직군은? (선택, 최대 2개)</p>';
      html += '<p class="q-hint">잘 모르겠다면 건너뛰어도 괜찮아요</p>';
      html += '<div class="chip-grid">';
      FAMILIES.forEach(function(f){
        var sel = answers.families.indexOf(f) > -1;
        html += '<button type="button" class="chip-opt" data-selected="'+sel+'" data-family="'+f+'">'+f+'</button>';
      });
      html += '</div>';
      html += '<p class="step-note">건너뛰어도 다음 단계로 진행할 수 있어요</p>';
    } else if (step === 3){
      html += '<p class="q-step-label">STEP 3 / 4</p>';
      html += '<p class="q-title">더 끌리는 업무 스타일은?</p>';
      html += '<p class="q-hint">가장 나와 가까운 것 하나를 선택하세요</p>';
      html += '<div class="opt-grid cols-2">';
      Object.keys(WORKSTYLE).forEach(function(k){
        var sel = answers.workstyle === k;
        html += '<button type="button" class="opt-card" data-selected="'+sel+'" data-workstyle="'+k+'">'+
          '<p class="opt-title">'+WORKSTYLE[k]+'</p></button>';
      });
      html += '</div>';
    } else if (step === 4){
      html += '<p class="q-step-label">STEP 4 / 4</p>';
      html += '<p class="q-title">나를 표현하는 키워드는? (선택, 최대 4개)</p>';
      html += '<p class="q-hint">해당하는 것을 모두 골라보세요</p>';
      html += '<div class="chip-grid">';
      KEYWORDS.forEach(function(k){
        var sel = answers.keywords.indexOf(k) > -1;
        var disable = (!sel && answers.keywords.length >= 4);
        html += '<button type="button" class="chip-opt" data-selected="'+sel+'" data-keyword="'+k+'" '+(disable?'disabled':'')+'>'+k+'</button>';
      });
      html += '</div>';
      html += '<p class="step-note">건너뛰어도 결과를 볼 수 있어요</p>';
    }
    $("stepContent").innerHTML = html;
    bindStepEvents();
    updateNav();
  }

  function bindStepEvents(){
    if (step === 1){
      document.querySelectorAll("[data-disc-primary]").forEach(function(el){
        el.addEventListener("click", function(){
          var k = el.getAttribute("data-disc-primary");
          answers.discPrimary = k;
          if (answers.discSecondary === k) answers.discSecondary = null;
          renderStep();
        });
      });
      document.querySelectorAll("[data-disc-secondary]").forEach(function(el){
        el.addEventListener("click", function(){
          var k = el.getAttribute("data-disc-secondary");
          answers.discSecondary = (answers.discSecondary === k) ? null : k;
          renderStep();
        });
      });
      var majorEl = $("majorInput");
      if (majorEl) majorEl.addEventListener("input", function(){ answers.major = majorEl.value; });
    } else if (step === 2){
      document.querySelectorAll("[data-family]").forEach(function(el){
        el.addEventListener("click", function(){
          var f = el.getAttribute("data-family");
          var idx = answers.families.indexOf(f);
          if (idx > -1) answers.families.splice(idx,1);
          else { if (answers.families.length >= 2) answers.families.shift(); answers.families.push(f); }
          renderStep();
        });
      });
    } else if (step === 3){
      document.querySelectorAll("[data-workstyle]").forEach(function(el){
        el.addEventListener("click", function(){ answers.workstyle = el.getAttribute("data-workstyle"); renderStep(); });
      });
    } else if (step === 4){
      document.querySelectorAll("[data-keyword]").forEach(function(el){
        el.addEventListener("click", function(){
          var k = el.getAttribute("data-keyword");
          var idx = answers.keywords.indexOf(k);
          if (idx > -1) answers.keywords.splice(idx,1);
          else if (answers.keywords.length < 4) answers.keywords.push(k);
          renderStep();
        });
      });
    }
  }

  function canProceed(){
    if (step === 1) return !!answers.discPrimary;
    if (step === 3) return !!answers.workstyle;
    return true; // step 2, 4 optional
  }

  function updateNav(){
    $("prevBtn").disabled = (step === 1);
    $("nextBtn").disabled = !canProceed();
    $("nextBtn").textContent = (step === TOTAL_STEPS) ? "내 직무분석 보기" : "다음";
  }

  $("prevBtn").addEventListener("click", function(){ if (step > 1){ step--; renderStep(); } });
  $("nextBtn").addEventListener("click", function(){
    if (!canProceed()) return;
    if (step < TOTAL_STEPS){ step++; renderStep(); }
    else { showResults(); }
  });

  // ---------------- 스코어링 ----------------
  function scoreJob(job){
    var score = 0;
    if (job.discPrimary === answers.discPrimary) score += 3;
    else if (job.discSecondary === answers.discPrimary) score += 1.5;
    if (answers.discSecondary){
      if (job.discPrimary === answers.discSecondary) score += 1.5;
      else if (job.discSecondary === answers.discSecondary) score += 1;
    }
    if (answers.families.length && answers.families.indexOf(job.family) > -1) score += 2;
    if (job.workstyle.indexOf(answers.workstyle) > -1) score += 2.5;
    var kwHits = job.keywords.filter(function(k){ return answers.keywords.indexOf(k) > -1; }).length;
    score += Math.min(kwHits, 3) * 1;
    return score;
  }

  function buildReason(job){
    var parts = [];
    var p = answers.discPrimary, s = answers.discSecondary;
    if (job.discPrimary === p) parts.push(DISC[p].label + "(" + DISC[p].desc + ") 성향");
    else if (job.discSecondary === p) parts.push(DISC[p].label + " 성향과도 잘 맞는 편");
    if (s && (job.discPrimary === s || job.discSecondary === s)) parts.push(DISC[s].label + " 보조 성향과도 어울림");
    if (job.workstyle.indexOf(answers.workstyle) > -1) parts.push("'" + WORKSTYLE[answers.workstyle] + "'을 선호하는 스타일");
    if (answers.families.indexOf(job.family) > -1) parts.push(job.family + " 직군에 대한 관심");
    var kwHits = job.keywords.filter(function(k){ return answers.keywords.indexOf(k) > -1; });
    if (kwHits.length) parts.push(kwHits.slice(0,3).join("·") + " 키워드");
    if (!parts.length) return "eDISC 유형을 기준으로 기본 추천되었습니다.";
    return parts.join(", ") + "이(가) 이 직무와 맞아떨어집니다.";
  }

  function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function showResults(){
    var scored = JOBS.map(function(job){ return { job:job, score:scoreJob(job) }; });
    scored.sort(function(a,b){ return b.score - a.score; });
    rankedJobs = scored.slice(0,5);
    selectedJobIndex = 0;

    $("quizWrap").classList.add("hidden");
    $("results").classList.add("active");

    var summaryHtml = "";
    var discCode = answers.discPrimary + (answers.discSecondary || "");
    var discLabelText = DISC[answers.discPrimary].label + (answers.discSecondary ? " · " + DISC[answers.discSecondary].label + "(보조)" : "");
    summaryHtml += '<span class="summary-tag">' + discCode + ' — ' + discLabelText + '</span>';
    if (answers.major) summaryHtml += '<span class="summary-tag">전공 · ' + escapeHtml(answers.major) + '</span>';
    if (answers.families.length) summaryHtml += '<span class="summary-tag">' + answers.families.join(" · ") + '</span>';
    summaryHtml += '<span class="summary-tag">' + WORKSTYLE[answers.workstyle] + '</span>';
    if (answers.keywords.length) summaryHtml += '<span class="summary-tag">' + answers.keywords.join(" · ") + '</span>';
    summaryHtml += '<button class="btn small" id="retakeBtn" type="button">다시 진단하기</button>';
    $("summaryBar").innerHTML = summaryHtml;
    $("retakeBtn").addEventListener("click", retake);

    renderRankList();
    renderBlueprint();
  }

  function renderRankList(){
    var maxScore = 10.5; // 절대 기준(disc 4.5 + family 2 + workstyle 2.5 + keyword 3 중 현실적 만점)
    var html = "";
    rankedJobs.forEach(function(entry, i){
      var pct = Math.min(99, Math.round((entry.score / maxScore) * 100));
      html += '<div class="rank-card" data-active="'+(i===selectedJobIndex)+'" data-idx="'+i+'">' +
        '<div class="rank-top"><span class="rank-name">'+(i+1)+'. '+escapeHtml(entry.job.name)+'</span></div>' +
        '<p class="rank-fam">'+escapeHtml(entry.job.family)+'</p>' +
        '<div class="rank-bar-track"><div class="rank-bar-fill" style="width:'+pct+'%"></div></div>' +
        '<p class="rank-reason">'+escapeHtml(buildReason(entry.job))+'</p>' +
      '</div>';
    });
    $("rankList").innerHTML = html;
    document.querySelectorAll(".rank-card").forEach(function(el){
      el.addEventListener("click", function(){
        selectedJobIndex = parseInt(el.getAttribute("data-idx"), 10);
        renderRankList();
        renderBlueprint();
      });
    });
  }

  function renderBlueprint(){
    var entry = rankedJobs[selectedJobIndex];
    var job = entry.job;
    var today = "";
    try{ var d = new Date(); today = d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"); }catch(e){}

    var html = "";
    html += '<div class="bp-head">' +
      '<p class="bp-eyebrow">My Job Analysis Report</p>' +
      '<h2 class="bp-jobname">'+escapeHtml(job.name)+'</h2>' +
      '<div class="bp-tags"><span class="tag">'+escapeHtml(job.family)+'</span>'+(answers.major ? '<span class="tag">'+escapeHtml(answers.major)+'</span>' : '')+'</div>' +
      '</div>';
    html += '<div class="bp-body">';

    html += '<div><p class="bp-section-title">왜 나와 맞을까?</p><p class="bp-reason">' + escapeHtml(buildReason(job)) + '</p></div>';

    html += '<div><p class="bp-section-title">직무 정의</p><p class="bp-definition">' + escapeHtml(job.def) + '</p></div>';

    html += '<div><p class="bp-section-title">주요 업무</p><ol class="bp-tasks">';
    job.tasks.forEach(function(t,i){ html += '<li><span class="n">'+(i+1)+'</span><span>'+escapeHtml(t)+'</span></li>'; });
    html += '</ol></div>';

    html += '<div><p class="bp-section-title">매력 · 어려움</p><div class="bp-split">' +
      '<div class="bp-box good"><div class="bp-box-title">😊 매력적인 점</div>'+escapeHtml(job.good)+'</div>' +
      '<div class="bp-box tough"><div class="bp-box-title">😓 어려운 점</div>'+escapeHtml(job.tough)+'</div>' +
      '</div></div>';

    html += '<div class="bp-line"><b>신입에게 요구되는 역량</b>' + escapeHtml(job.req) + '</div>';
    html += '<div class="bp-line"><b>2025~2026 트렌드</b>' + escapeHtml(job.trend) + '</div>';

    html += '<div><p class="bp-section-title">다음 액션 체크리스트</p><div class="bp-actions">';
    ACTIONS.forEach(function(a,i){ html += '<label><input type="checkbox">'+escapeHtml(a)+'</label>'; });
    html += '</div></div>';

    html += '</div>';
    html += '<div class="bp-footer"><button class="btn small ghost" id="printBtn" type="button">인쇄·PDF 저장</button><span>' + today + '</span></div>';

    $("blueprint").innerHTML = html;
    $("printBtn").addEventListener("click", function(){ window.print(); });
  }

  function retake(){
    answers = { discPrimary:null, discSecondary:null, major:"", families:[], workstyle:null, keywords:[] };
    step = 1;
    $("results").classList.remove("active");
    $("quizWrap").classList.remove("hidden");
    renderStep();
  }

  renderStep();
})();
</script>
</body>
</html>
